name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> dist/target'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Vyper
        run: python -m pip install 'vyper==0.4.3'

      - name: Install Solidity compilers
        run: |
          install_solc() {
            local version="$1" commit="$2" checksum="$3" binary
            binary="$HOME/.svm/$version/solc-$version"
            mkdir -p "$(dirname "$binary")"
            curl --fail --silent --show-error --location --retry 3 \
              "https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v$version+commit.$commit" \
              --output "$binary"
            printf '%s  %s\n' "$checksum" "$binary" | sha256sum --check
            chmod +x "$binary"
          }
          install_solc 0.8.29 ab55807c 18d418a40dc04d17656b1b5c8a7b35cfbab8942b51f38d005d5b59e8aa6637e0
          install_solc 0.8.30 73712a01 f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7

      - name: Lint, format check, build, and test
        run: pnpm all

      - name: Run compiler benchmarks
        run: pnpm bench
